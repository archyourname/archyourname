<svg
  width="600"
  height="120"
  viewBox="0 0 600 120"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Background -->
    <linearGradient
      id="bg"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#061313"/>
      <stop offset="100%" stop-color="#071827"/>
    </linearGradient>

    <!-- Soft underwater glow -->
    <radialGradient id="waterGlow">
      <stop
        offset="0%"
        stop-color="#00e5cc"
        stop-opacity="0.12"
      />
      <stop
        offset="50%"
        stop-color="#00e5cc"
        stop-opacity="0.035"
      />
      <stop
        offset="100%"
        stop-color="#00e5cc"
        stop-opacity="0"
      />
    </radialGradient>

    <!-- Text styles -->
    <style>
      .type-text {
        font-family: "Courier New", Courier, monospace;
        font-size: 28px;
        font-weight: bold;
        fill: #00e5cc;
      }

      .sub-text {
        font-family: "Courier New", Courier, monospace;
        font-size: 18px;
        fill: #37b6a8;
      }

      /* Typing animation */
      .line1-clip {
        animation: reveal1 6s steps(20, end) infinite;
      }

      .line2-clip {
        animation: reveal2 6s steps(19, end) infinite;
      }

      @keyframes reveal1 {
        0%,
        5% {
          width: 0;
        }

        33.3% {
          width: 360px;
        }

        83.3% {
          width: 360px;
        }

        91.6%,
        100% {
          width: 0;
        }
      }

      @keyframes reveal2 {
        0%,
        33.3% {
          width: 0;
        }

        66.6% {
          width: 330px;
        }

        83.3% {
          width: 330px;
        }

        91.6%,
        100% {
          width: 0;
        }
      }
    </style>

    <!-- Clip paths -->
    <clipPath id="clip1">
      <rect
        class="line1-clip"
        x="0"
        y="15"
        width="0"
        height="40"
      />
    </clipPath>

    <clipPath id="clip2">
      <rect
        class="line2-clip"
        x="0"
        y="65"
        width="0"
        height="30"
      />
    </clipPath>

  </defs>


  <!-- Main background -->
  <rect
    width="600"
    height="120"
    rx="9"
    fill="url(#bg)"
    stroke="#123333"
    stroke-width="1"
  />


  <!-- Underwater glow -->
  <ellipse
    cx="500"
    cy="65"
    rx="110"
    ry="60"
    fill="url(#waterGlow)"
  />


  <!-- Line 1 -->
  <text
    class="type-text"
    x="10"
    y="45"
    clip-path="url(#clip1)"
  >Welcome to Github Page</text>


  <!-- Line 2 -->
  <text
    class="sub-text"
    x="10"
    y="90"
    clip-path="url(#clip2)"
  >PontMedusa</text>


  <!-- Underwater bubbles -->
  <g
    fill="none"
    stroke="#00e5cc"
    stroke-width="0.7"
    opacity="0.32"
  >

    <!-- Bubble 1 -->
    <circle cx="390" cy="105" r="2">
      <animate
        attributeName="cy"
        values="105;96;87;78"
        dur="5s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="cx"
        values="390;394;391;395"
        dur="5s"
        repeatCount="indefinite"
      />
    </circle>


    <!-- Bubble 2 -->
    <circle cx="450" cy="100" r="1.4">
      <animate
        attributeName="cy"
        values="100;91;82;73"
        dur="6s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="cx"
        values="450;447;452;449"
        dur="6s"
        repeatCount="indefinite"
      />
    </circle>


    <!-- Bubble 3 -->
    <circle cx="520" cy="95" r="1.7">
      <animate
        attributeName="cy"
        values="95;85;75;65;55"
        dur="5.8s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="cx"
        values="520;516;522;518;524"
        dur="5.8s"
        repeatCount="indefinite"
      />
    </circle>


    <!-- Bubble 4 -->
    <circle cx="575" cy="92" r="1.5">
      <animate
        attributeName="cy"
        values="92;84;76;68"
        dur="6s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="cx"
        values="575;572;577;574"
        dur="6s"
        repeatCount="indefinite"
      />
    </circle>


    <!-- Small bubble -->
    <circle cx="525" cy="18" r="1.3">
      <animate
        attributeName="cy"
        values="18;14;10;6"
        dur="5.5s"
        repeatCount="indefinite"
      />
    </circle>

  </g>

</svg>
